# =====================================================================
# WINDOWS / ACTIVE DIRECTORY  (Phases 6-9 - ACTIVE)
# The live Book of Hades pivot is RDP as persephone onto a domain-joined Windows
# workstation (persephone), and the back half (escalation, loot decrypt, payload,
# shutdown) all runs ON that internal Windows host - so it is observable here.
# Requires the Windows UF on persephone + DC shipping WinEventLog:Security/System
# to index=windows, "Audit Process Creation" + command-line auditing enabled for
# the 4688 process alerts, and (recommended) Sysmon. Install Splunk_TA_windows on
# the indexer for clean field extraction.
# =====================================================================

# ---------- STAGE 6 : Pivot onto a Windows workstation ----------

[Zeus - S6c - Windows Logon from DMZ Pivot]
search = index=windows (EventCode=4624 OR EventCode=4625) (Logon_Type=3 OR Logon_Type=10) | eval src=coalesce(Source_Network_Address, src_ip, Ip_Address) | rex field=src "(?<srcip>\d+\.\d+\.\d+\.\d+)" | where cidrmatch("10.1.1.0/28", srcip) | stats count values(EventCode) as codes values(Logon_Type) as logon_types values(Account_Name) as accounts by srcip, ComputerName
description = Network (type 3) or RDP (type 10) logon to a Windows host sourced from the DMZ gatehouse subnet - the phished AD credential used to pivot. CRITICAL.
dispatch.earliest_time = -6m@m
dispatch.latest_time = now
enableSched = 1
cron_schedule = */1 * * * *
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 6
alert.suppress = 1
alert.suppress.period = 900s
alert.suppress.fields = srcip


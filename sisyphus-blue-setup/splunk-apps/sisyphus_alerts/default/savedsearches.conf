description = Network (type 3) or RDP (type 10) logon to a Windows host sourced from the DMZ gatehouse subnet by a real USER account - the phished AD credential used to pivot. CRITICAL. Tuned 18/11: excludes machine/computer accounts (Target_User_Name ending in $) and ANONYMOUS LOGON so routine DMZ machine-to-machine network logons do not fire; surfaces the logged-on user.

# WINDOWS / ACTIVE DIRECTORY  (Phases 6-9 - ACTIVE)
# The live Book of Hades pivot is RDP as persephone onto a domain-joined Windows
# workstation (persephone), and the back half (escalation, loot decrypt, payload,
# shutdown) all runs ON that internal Windows host - so it is observable here.
# Requires the Windows UF on persephone + DC shipping WinEventLog:Security/System
# to index=windows, "Audit Process Creation" + command-line auditing enabled for
# the 4688 process alerts, and (recommended) Sysmon. Install Splunk_TA_windows on
# the indexer for clean field extraction.
# =====================================================================

# ---------- STAGE 6 : Pivot onto a Windows workstation ----------

[Zeus - S6a - Windows Logon from DMZ Pivot]
